name: Drug data validators

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  validators:
    name: Validate drug data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run validators
        shell: bash
        run: |
          failed=0
          for script in \
            check_cardiovascular_timecourse \
            check_clinical_dose_references \
            check_endocrine_pack \
            check_hrt_migration \
            check_medication_catalog \
            check_medication_ids \
            check_timecourse_semantics \
            check_timeline_duration_sources; do
            echo "::group::${script}"
            if ! python3 "tools/drugdata/${script}.py"; then
              echo "::error::${script} failed"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "${failed}"
